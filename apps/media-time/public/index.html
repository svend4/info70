<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Media Time Planner</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-app="media-time">
  <main class="shell">
    <nav class="topbar" aria-label="Prototype navigation">
      <strong>info70 Kinder-Netz</strong>
      <span>Medienzeit</span>
    </nav>

    <section class="hero">
      <p class="kicker">Medienzeit</p>
      <h1 id="title">Family Media Time Planner</h1>
      <p class="audience" id="audience"></p>
      <p class="lede" id="promise"></p>
      <button id="primary-action" type="button"></button>
    </section>

    <section class="scorecard" aria-labelledby="score-heading">
      <h2 id="score-heading">Warum dieses Produkt?</h2>
      <p id="app-rationale">Loading demand analysis…</p>
    </section>

    <section class="grid" id="feature-cards" aria-label="MVP features"></section>

    <section class="two-column">
      <article class="panel">
        <h2>Safety checklist</h2>
        <ul id="checklist"></ul>
      </article>
      <article class="panel">
        <h2>Nächster Sprint</h2>
        <ol id="next-sprint"></ol>
      </article>
    </section>

    <section class="two-column">
      <article class="panel">
        <h2>Flow-Prototyp</h2>
        <ol id="flow-steps"></ol>
      </article>
      <article class="panel">
        <h2>Interaktive Demo</h2>
        <div class="demo-panel" id="demo-panel"></div>
        <p class="demo-output" id="demo-output">Wähle eine Demo-Situation.</p>
      </article>
    </section>

    <section class="domain-section">
      <h2 id="domain-title"></h2>
      <div class="domain-grid" id="domain-items"></div>
    </section>

    <section class="resources">
      <h2>Vertrauenswürdige Ressourcen</h2>
      <div id="resources"></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
