  <meta name="description" content="Geschichten-Wender – Ko-Nutzungs-App für Kinder von 5 bis 7, nur gemeinsam mit einem Erwachsenen. Eine kurze Geschichte steht schon da, und das Kind baut sie um: anders ausgehen lassen, ein fehlendes Stück erfinden, oder von hinten nach vorn. Es gibt keine Musterlösung und kein Ziel, das erreicht werden muss – jede Vorlage trägt drei verschiedene Ideen, und die sind für die Erwachsenen. Der Erwachsene liest vor und schreibt mit; es gibt kein Textfeld, keine Aufnahme und keine KI. Am Ende ein druckbares Blatt mit Schreiblinien. Offline, werbefrei, speichert nichts." />
