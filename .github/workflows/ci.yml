name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test-and-validate:
    name: Test and validate (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests and monorepo validation
        run: npm run check
